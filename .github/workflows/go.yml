name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Fill in version
        run: sed -i 's/"YXZ"/"${GITHUB_SHA}"/g' symbol/version.go

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: ui

      - name: Typecheck, lint, test and build
        run: |
          bunx tsc --noEmit
          bun run lint
          bun run test
          bun run build
        working-directory: ui

  test:
    needs: build
    runs-on: ubuntu-latest

    services:
      rabbit_mq:
        image: rabbitmq:3.8
        env:
          RABBITMQ_DEFAULT_USER: rabbitmq_user
          RABBITMQ_DEFAULT_PASS: rabbitmq_pass
        ports:
          - 5672:5672
      redis:
        image: redis
        ports:
          - 6379:6379
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:11
        env:
          POSTGRES_DB: db_name
          POSTGRES_PASSWORD: db_pass
          POSTGRES_USER: db_user
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Generate mock data
        run: |
          python -m pip install --upgrade pip
          cd migration/mock
          python -m pip install -r requirements.txt
          python mock.py

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build

      - name: Check services
        run: ./infomark console configuration test .infomark-ci.yml

      - name: Migrate Database
        run: INFOMARK_CONFIG_FILE=`realpath .infomark-ci.yml` ./infomark console database migrate

      - name: Seed Database
        run: |
          cd migration/mock
          PGPASSWORD=db_pass psql -h 'localhost' -U 'db_user' -d 'db_name' -f mock.sql

      - name: Run unit tests
        run: |
          export INFOMARK_CONFIG_FILE=`realpath .infomark-ci.yml`
          go test ./... -cover -v --goblin.timeout 15s -coverprofile coverage.out
